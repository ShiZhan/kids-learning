<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三位数×两位数积最大最小 闯关练习</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{max-width:720px;margin:2rem auto;padding:0 1rem;background:#f7f9fc;color:#222}
.box{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px #00000014;margin-bottom:16px}
h1{text-align:center;font-size:22px;margin-top:0}
.digits{font-size:24px;font-weight:bold;color:#2563eb;margin:12px 0}
.qtype{font-size:16px;color:#666;margin-bottom:10px}
input{padding:10px;width:120px;font-size:18px;border:1px solid #ccc;border-radius:8px;margin:4px}
button{padding:10px 18px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin:4px}
button#next{background:#10b981}
.ans-area{margin-top:14px;font-size:17px;min-height:40px}
.right{color:#16a34a;font-weight:bold}
.wrong{color:#dc2626;font-weight:bold}
.score{text-align:right;font-size:18px;margin-bottom:8px}
.tip{font-size:14px;color:#555;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<div class="score">得分：<span id="score">0</span></div>
<div class="box">
<h1>数字组算式闯关</h1>
<div class="qtype" id="qtype-text"></div>
<div class="digits">可用数字：<span id="digit-list"></span></div>
<div>
请填写：<input id="n1" placeholder="三位数"> × <input id="n2" placeholder="两位数">
</div>
<div class="ans-area" id="feedback"></div>
<div style="margin-top:16px">
<button id="submit">提交答案</button>
<button id="next">下一题</button>
</div>
<div class="tip">规则：5个数字每个只能用一次，组成三位数 × 两位数，0不能在最高位</div>
</div>

<script>
// 成功音效：轻快“太棒了”提示音（WebAudio，无外部文件）
let audioCtx;
function playSuccessTone(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = "sine";
    osc1.frequency.value = 587;
    osc2.type = "sine";
    osc2.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start();
    osc1.stop(audioCtx.currentTime + 0.15);
    osc2.start(audioCtx.currentTime+0.18);
    osc2.stop(audioCtx.currentTime + 0.35);
}

const pool = [
    [0,3,5,7,9],
    [0,2,4,6,8],
    [0,1,4,7,8],
    [0,2,3,7,9],
    [0,1,5,6,9],
    [0,3,4,6,8],
];
let currentDigits = [];
let targetKind = "max";
let score = 0;

function calcBest(digits, wantMax=true){
    const d = [...digits];
    let bestVal = wantMax ? -Infinity : Infinity;
    let bestPair = null;
    function permute(arr, start){
        if(start === arr.length){
            const a3 = arr[0]*100 + arr[1]*10 + arr[2];
            const a2 = arr[3]*10 + arr[4];
            if(arr[0]===0 || arr[3]===0) return;
            const mul = a3 * a2;
            if(wantMax){
                if(mul>bestVal){ bestVal=mul; bestPair=[a3,a2]; }
            }else{
                if(mul<bestVal){ bestVal=mul; bestPair=[a3,a2]; }
            }
            return;
        }
        for(let i=start;i<arr.length;i++){
            [arr[start],arr[i]] = [arr[i],arr[start]];
            permute(arr, start+1);
            [arr[start],arr[i]] = [arr[i],arr[start]];
        }
    }
    permute(d,0);
    return {pair:bestPair, value:bestVal};
}

function newQuestion(){
    const pick = pool[Math.floor(Math.random()*pool.length)];
    currentDigits = [...pick];
    targetKind = Math.random()>0.5 ? "max" : "min";
    document.getElementById("digit-list").textContent = currentDigits.join("，");
    document.getElementById("qtype-text").textContent = targetKind==="max" ? "题目：构造算式，使乘积最大" : "题目：构造算式，使乘积最小";
    document.getElementById("n1").value="";
    document.getElementById("n2").value="";
    document.getElementById("feedback").textContent="";
}

function checkAnswer(){
    const v1 = parseInt(document.getElementById("n1").value);
    const v2 = parseInt(document.getElementById("n2").value);
    if(isNaN(v1) || isNaN(v2)){
        document.getElementById("feedback").innerHTML = `<span class="wrong">请输入有效数字！</span>`;
        return;
    }
    const s1 = String(v1).split("").map(Number);
    const s2 = String(v2).split("").map(Number);
    const allUsed = [...s1,...s2];
    if(s1.length!==3 || s2.length!==2){
        document.getElementById("feedback").innerHTML = `<span class="wrong">必须是【三位数 × 两位数】！</span>`;
        return;
    }
    const copyD = [...currentDigits].sort();
    const copyU = allUsed.sort();
    if(copyD.join() !== copyU.join()){
        document.getElementById("feedback").innerHTML = `<span class="wrong">数字使用不对！每个数字只能用一次，只能用给出的数字</span>`;
        return;
    }
    const ans = calcBest(currentDigits, targetKind==="max");
    const userMul = v1*v2;
    if(userMul === ans.value){
        score +=1;
        document.getElementById("score").textContent = score;
        document.getElementById("feedback").innerHTML = `<span class="right">✅ 正确！乘积 ${userMul}</span>`;
        playSuccessTone(); //答对播放音效
    }else{
        document.getElementById("feedback").innerHTML = `<span class="wrong">❌ 不对。正确算式：${ans.pair[0]} × ${ans.pair[1]} = ${ans.value}</span>`;
    }
}

document.getElementById("submit").onclick = checkAnswer;
document.getElementById("next").onclick = newQuestion;
newQuestion();
</script>
</body>
</html>
