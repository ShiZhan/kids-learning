<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积的变化规律｜长方形绿地闯关</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{max-width:720px;margin:2rem auto;padding:0 1rem;background:#f7f9fc;color:#222}
.box{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px #00000014;margin-bottom:16px}
h1{text-align:center;font-size:22px;margin-top:0}
.question{font-size:17px;line-height:1.7;margin:12px 0}
.rect{width:220px;height:80px;background:#bde0fe;border:2px solid #2563eb;border-radius:6px;margin:10px auto;display:flex;align-items:center;justify-content:center;color:#0b4b99;font-weight:bold}
input{padding:10px;width:140px;font-size:18px;border:1px solid #ccc;border-radius:8px;margin:4px}
button{padding:10px 18px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin:4px}
button#next{background:#10b981}
button#hintBtn{background:#f59e0b}
.ans-area{margin-top:14px;font-size:17px;min-height:50px}
.right{color:#16a34a;font-weight:bold}
.wrong{color:#dc2626;font-weight:bold}
.score{text-align:right;font-size:18px;margin-bottom:8px}
.tip{font-size:14px;color:#555;margin-top:10px;line-height:1.5;background:#fffbeb;padding:10px;border-radius:8px}
.solution{margin-top:10px;font-size:15px;color:#333}
</style>
</head>
<body>
<div class="score">得分：<span id="score">0</span></div>
<div class="box">
<h1>长方形绿地 · 积的变化规律</h1>
<div class="rect">绿地示意图（长不变）</div>
<div class="question" id="q-text"></div>
<div>
你的答案：<input id="userAns" placeholder="填写面积"> 平方米
</div>
<div class="ans-area" id="feedback"></div>
<div class="solution" id="solutionBox" style="display:none"></div>
<div style="margin-top:16px">
<button id="submit">提交答案</button>
<button id="hintBtn">看思路提示</button>
<button id="next">下一题</button>
</div>
<div class="tip">
核心规律：长方形面积=长×宽；<br>长不变，宽乘几倍，面积就乘几倍（积的变化规律）<br>⚠️重点区分：<b>增加到</b>（变成这个数） vs <b>增加了</b>（在原来基础上再加）
</div>
</div>

<script>
// 成功音效 和上面同一个音色
let audioCtx;
function playSuccessTone(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc1.type = "sine";
    osc1.frequency.value = 587;
    osc2.type = "sine";
    osc2.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc1.start();
    osc1.stop(audioCtx.currentTime + 0.15);
    osc2.start(audioCtx.currentTime+0.18);
    osc2.stop(audioCtx.currentTime + 0.35);
}

const pool = [
    [8, 240, 24, "to"],
    [8, 200, 24, "to"],
    [5, 65, 40, "to"],
    [6, 72, 30, "to"],
    [9, 180, 27, "to"],
    [8, 240, 24, "add"],
    [7, 140, 21, "add"],
    [4, 120, 12, "add"],
    [10, 300, 40, "to"],
    [12, 360, 36, "add"],
];
let score = 0;
let current = null;
let correctAnswer = 0;
let simpleFormula = "";
let hardFormula = "";

function newQuestion(){
    const idx = Math.floor(Math.random()*pool.length);
    current = pool[idx];
    const [wOld, sOld, wNewRaw, qType] = current;
    let realNewW, qStr;
    if(qType === "to"){
        realNewW = wNewRaw;
        qStr = `一块长方形绿地，长不变，宽是${wOld}米，面积${sOld}平方米。宽<b>增加到</b>${realNewW}米，扩大后的绿地面积是多少平方米？`;
        const times = realNewW / wOld;
        correctAnswer = sOld * times;
        simpleFormula = `简便法（积的变化规律）：${realNewW} ÷ ${wOld} = ${times}，${sOld} × ${times} = ${correctAnswer}`;
        hardFormula = `普通硬算法：先求长 ${sOld} ÷ ${wOld} = ${sOld/wOld} 米，再算面积 ${sOld/wOld} × ${realNewW} = ${correctAnswer}`;
    }else{
        realNewW = wOld + wNewRaw;
        qStr = `一块长方形绿地，长不变，宽是${wOld}米，面积${sOld}平方米。宽<b>增加了</b>${wNewRaw}米，扩大后的绿地面积是多少平方米？`;
        const times = realNewW / wOld;
        correctAnswer = sOld * times;
        simpleFormula = `简便法（积的变化规律）：新宽 ${wOld}+${wNewRaw}=${realNewW}，${realNewW} ÷ ${wOld} = ${times}，${sOld} × ${times} = ${correctAnswer}`;
        hardFormula = `普通硬算法：先求长 ${sOld} ÷ ${wOld} = ${sOld/wOld} 米，再算面积 ${sOld/wOld} × ${realNewW} = ${correctAnswer}`;
    }
    document.getElementById("q-text").innerHTML = qStr;
    document.getElementById("userAns").value = "";
    document.getElementById("feedback").textContent = "";
    document.getElementById("solutionBox").style.display = "none";
}

function check(){
    const val = Number(document.getElementById("userAns").value.trim());
    if(isNaN(val)){
        document.getElementById("feedback").innerHTML = `<span class="wrong">❌ 请输入数字！</span>`;
        return;
    }
    if(val === correctAnswer){
        score++;
        document.getElementById("score").textContent = score;
        document.getElementById("feedback").innerHTML = `<span class="right">✅ 回答正确！</span>`;
        playSuccessTone(); //答对播放音效
    }else{
        document.getElementById("feedback").innerHTML = `<span class="wrong">❌ 不对，正确答案：${correctAnswer}</span>`;
    }
}
function showHint(){
    document.getElementById("solutionBox").style.display = "block";
    document.getElementById("solutionBox").innerHTML =
        `<div>👉 简便思路（本课重点）：${simpleFormula}</div>
         <div>👉 硬算思路（之前习惯的方法）：${hardFormula}</div>`;
}

document.getElementById("submit").onclick = check;
document.getElementById("hintBtn").onclick = showHint;
document.getElementById("next").onclick = newQuestion;
newQuestion();
</script>
</body>
</html>
